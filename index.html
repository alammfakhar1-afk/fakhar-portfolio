<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fakhar Alam | Talking-Head Video Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap" rel="stylesheet">
<style id="styles">
:root{
  --bg:#FFFFFF; --ink:#111111; --ink-2:#3D3D3D; --muted:#7A7A7A; --line:#E9E9E7; --soft:#F4F4F2;
  --accent:#EF8665; --on-accent:#111111;
  --glass:linear-gradient(140deg,rgba(255,255,255,.74),rgba(255,255,255,.36));
  --glass-edge:rgba(255,255,255,.75);
  --glass-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 1px rgba(255,255,255,.35),inset 0 0 14px rgba(255,255,255,.35),0 12px 32px -14px rgba(17,17,17,.22);
  --ease:cubic-bezier(.16,1,.3,1);
  --font:"Archivo", "Helvetica Neue", Arial, system-ui, sans-serif;
  --wrap:1240px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);scroll-behavior:smooth;background:var(--bg)}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-smooth [data-lenis-prevent]{overscroll-behavior:contain}
.lenis.lenis-stopped{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{max-width:100%;display:block}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 clamp(20px,4vw,48px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

/* nav */
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:50;padding:0 clamp(12px,3vw,32px)}
.nav-pill{max-width:var(--wrap);margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:62px;padding:0 10px 0 22px;border-radius:99px;transition:box-shadow .6s var(--ease)}
.nav.scrolled .nav-pill{box-shadow:var(--glass-shadow),0 18px 40px -18px rgba(17,17,17,.3)}
.logo{font-weight:850;font-stretch:72%;font-size:24px;letter-spacing:-.01em;text-decoration:none;display:flex;align-items:center;gap:10px}
.logo i{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.nav ul{list-style:none;display:flex;gap:6px;margin:0;padding:0}
.nav a.nl{text-decoration:none;font-size:15px;font-weight:500;padding:8px 14px;border-radius:99px;transition:background .4s var(--ease)}
.nav a.nl:hover{background:rgba(255,255,255,.7)}
.nav a.nl.cta{background:var(--ink);color:#fff}
.nav a.nl.cta:hover{background:var(--accent);color:var(--on-accent)}

/* hero */
.hero{padding:clamp(48px,7vw,96px) 0 clamp(64px,8vw,110px);margin-top:-74px;padding-top:calc(74px + clamp(48px,7vw,96px))}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:clamp(32px,5vw,72px);align-items:center}
.hello{font-size:17px;font-weight:500;color:var(--ink-2);margin:0 0 18px;display:flex;align-items:center;gap:10px}
.hello .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(239,134,101,.2)}
.display{font-weight:880;font-stretch:66%;font-size:clamp(54px,8.6vw,132px);line-height:.88;letter-spacing:-.018em;margin:0;text-wrap:balance}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.06em;margin-bottom:-.06em}
.w>span{display:inline-block;transform:translateY(105%);transition:transform 1.1s var(--ease)}
.booted .w>span,.in .w>span{transform:none}
.mark{background-image:linear-gradient(var(--accent),var(--accent));background-repeat:no-repeat;background-size:0% 78%;background-position:0 62%;transition:background-size 1.2s var(--ease);padding:0 .06em;margin:0 -.06em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.mark.on{background-size:100% 78%}
.sub{font-size:clamp(18px,1.6vw,22px);color:var(--ink-2);max-width:34ch;margin:28px 0 0;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 0;padding:0;list-style:none}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;border-radius:99px;font-size:14px;font-weight:600;transform:scale(.6);opacity:0;transition:transform .7s var(--ease),opacity .5s var(--ease)}
.chip .ic{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center}
.chip .ic svg{width:10px;height:10px;fill:#fff}
.booted .chip,.chips.in .chip{transform:none;opacity:1}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:54px;padding:0 26px;border-radius:99px;font-weight:650;font-size:16px;text-decoration:none;border:1.5px solid var(--ink);cursor:pointer;transition:transform .5s var(--ease),background .4s var(--ease),color .4s var(--ease)}
.btn:hover{transform:translateY(-2px)}
.btn-ink{background:var(--ink);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 12px 28px -12px rgba(17,17,17,.5)}
.btn-ink:hover{background:var(--accent);color:var(--on-accent)}
.btn-line{border-color:var(--glass-edge);outline:1px solid rgba(17,17,17,.14);outline-offset:-1px}
.btn-line:hover{background:var(--ink);color:#fff;outline-color:var(--ink)}

.hero-media{margin:0;justify-self:end;width:100%;max-width:420px}
.frame{position:relative;aspect-ratio:4/5;border-radius:28px;overflow:hidden;background:var(--soft);clip-path:inset(0 0 100% 0 round 28px);transition:clip-path 1.4s var(--ease)}
.booted .frame,.frame.in{clip-path:inset(0 0 0 0 round 28px)}
.frame img{width:100%;height:100%;object-fit:cover;transform:scale(1.14);transition:transform 2.4s var(--ease)}
.booted .frame img,.frame.in img{transform:scale(1.02)}
.frame.kb img{animation:kb 18s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.1) translate(-1%,-1.5%)}}
.frame .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-weight:600}
.rec{position:absolute;top:16px;left:16px;display:flex;align-items:center;gap:8px;color:#fff;font-size:12px;font-weight:650;padding:6px 11px;border-radius:99px;font-variant-numeric:tabular-nums}
.rec i{width:7px;height:7px;border-radius:50%;background:#FF3B30;animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.badge{position:absolute!important;top:16px;right:16px;display:flex;align-items:center;gap:8px;color:var(--ink);font-size:13px;font-weight:700;padding:6px 12px 6px 6px;border-radius:14px;transform:scale(0);transform-origin:top right;transition:transform .7s var(--ease) .9s}
.booted .badge,.frame.in .badge{transform:scale(1)}
.badge .ic{width:24px;height:24px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.badge .ic svg{width:11px;height:11px}
.cap{position:absolute;left:0;right:0;bottom:12%;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.cap span{font-weight:880;font-stretch:72%;font-size:clamp(28px,3.4vw,40px);line-height:1;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35),0 4px 22px rgba(0,0,0,.5);text-align:center;letter-spacing:-.005em;display:inline-block;animation:pop .55s var(--ease) both}
.cap span em{font-style:normal;color:var(--accent)}
@keyframes pop{from{transform:scale(.7) translateY(8px);opacity:0}to{transform:none;opacity:1}}


/* liquid glass */
.glass,.nav-pill,.chip,.btn-line,.ccard,.tools li,.badge,.about-tag,.play{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(185%);backdrop-filter:blur(18px) saturate(185%);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow)}
.nav-pill::after,.chip::after,.btn-line::after,.ccard::after,.badge::after,.about-tag::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 70% at 18% 0%,rgba(255,255,255,.7),rgba(255,255,255,0) 55%);mix-blend-mode:soft-light}
.glass-dark{background:linear-gradient(140deg,rgba(17,17,17,.42),rgba(17,17,17,.22));-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 8px 24px -10px rgba(0,0,0,.4)}
.blobs{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.blobs i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.42;background:radial-gradient(circle at 35% 35%,var(--accent),transparent 68%);animation:drift 22s ease-in-out infinite alternate}
.blobs i:nth-child(2){background:radial-gradient(circle at 50% 50%,#FFD3C2,transparent 66%);animation-duration:28s;animation-delay:-6s;opacity:.55}
.blobs i:nth-child(3){background:radial-gradient(circle at 50% 50%,rgba(17,17,17,.14),transparent 70%);animation-duration:34s;opacity:.6}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(6%,8%,0) scale(1.15)}}
.has-blobs{position:relative;isolation:isolate}
.has-blobs>.wrap{position:relative;z-index:1}


/* video portfolio */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.filters button{height:42px;padding:0 18px;border-radius:99px;font-weight:650;font-size:15px;cursor:pointer;color:var(--ink);transition:background .5s var(--ease),color .5s var(--ease),transform .5s var(--ease)}
.filters button:hover{transform:translateY(-1px)}
.filters button[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.filters button[aria-selected="true"]::after{opacity:0}
.filters button em{font-style:normal;opacity:.55;margin-left:6px;font-weight:600}
.cat-desc{color:var(--ink-2);max-width:60ch;margin:0 0 28px;min-height:1.55em}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:clamp(14px,1.6vw,22px)}
.vcard{display:flex;flex-direction:column;gap:14px;text-align:left;background:none;border:0;padding:0;cursor:pointer;color:inherit;transition:opacity .5s var(--ease),transform .7s var(--ease)}
.vcard.gone{display:none}
.vcard.fade{opacity:0;transform:translateY(14px) scale(.98)}
.vthumb{position:relative;aspect-ratio:9/16;border-radius:22px;overflow:hidden;background:#1C1C1C;box-shadow:0 20px 40px -26px rgba(17,17,17,.5);transition:transform .8s var(--ease),box-shadow .8s var(--ease)}
.vcard:hover .vthumb{transform:translateY(-4px);box-shadow:0 30px 50px -26px rgba(17,17,17,.55)}
.vthumb img,.vthumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vthumb video{opacity:0;transition:opacity .6s var(--ease)}
.vthumb.playing video{opacity:1}
.vthumb::after{content:"";position:absolute;inset:auto 0 0;height:42%;background:linear-gradient(transparent,rgba(17,17,17,.55));pointer-events:none}
.vplay{position:absolute!important;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;display:grid;place-items:center;color:var(--ink);z-index:2;transition:transform .6s var(--ease),opacity .5s var(--ease)}
.vplay svg{width:18px;height:18px;margin-left:3px}
.vcard:hover .vplay{transform:scale(1.08)}
.vthumb.playing .vplay{opacity:0;transform:scale(.8)}
.vtag{position:absolute;left:12px;top:12px;z-index:2;padding:5px 10px;border-radius:10px;font-size:12px;font-weight:700;color:#fff}
.vdur{position:absolute;right:12px;bottom:12px;z-index:2;font-size:12px;font-weight:650;color:#fff;font-variant-numeric:tabular-nums}
.vmeta h3{margin:0;font-size:19px;font-weight:750;font-stretch:90%;line-height:1.2}
.vmeta p{margin:6px 0 0;font-size:15px;color:var(--ink-2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vmeta small{display:block;margin-top:4px;font-size:13px;color:var(--muted);font-weight:600}
.empty-work{padding:48px 24px;border-radius:24px;border:1.5px dashed #D8D8D4;text-align:center;color:var(--muted)}
.drive-links{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.drive-links a{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 20px;border-radius:99px;text-decoration:none;font-weight:650}
.drive-links a.gone{display:none}

.lb{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 20px);visibility:hidden;opacity:0;transition:opacity .5s var(--ease),visibility 0s linear .5s}
.lb.open{visibility:visible;opacity:1;transition:opacity .5s var(--ease)}
.lb-back{position:absolute;inset:0;background:rgba(17,17,17,.55);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%)}
.lb-box{position:relative;display:flex;gap:24px;align-items:stretch;padding:14px;border-radius:30px;max-width:min(1120px,100%);max-height:100%;transform:translateY(24px) scale(.97);transition:transform .7s var(--ease)}
.lb.open .lb-box{transform:none}
.lb-video{flex:none;border-radius:20px;overflow:hidden;background:#000;display:flex}
.lb-video video{display:block;height:min(80vh,760px);max-width:100%;aspect-ratio:9/16;background:#000;object-fit:contain}
.lb.wide .lb-box{flex-direction:column}
.lb.wide .lb-video video{height:auto;width:min(1040px,calc(100vw - 68px));aspect-ratio:16/9;max-height:68vh}
.lb-info{width:300px;padding:14px 8px 8px 0;display:flex;flex-direction:column;gap:10px}
.lb.wide .lb-info{width:auto;padding:2px 8px 6px}
.lb-info .tagchip{align-self:flex-start}
.lb-info h3{margin:0;font-size:28px;font-weight:850;font-stretch:72%;line-height:1}
.lb-info p{margin:0;color:var(--ink-2)}
.lb-nav{display:flex;gap:8px;margin-top:auto;padding-top:12px}
.lb-nav button,.lb-close{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.lb-nav svg,.lb-close svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lb-close{position:absolute!important;top:-14px;right:-14px;z-index:3}
@media (max-width:760px){
 .lb-box{flex-direction:column;gap:12px;padding:10px;border-radius:24px}
 .lb-video video{height:auto;width:100%;max-height:64vh}
 .lb-info{width:auto;padding:4px 6px 6px}
 .lb-close{top:-10px;right:-6px}
 .vgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .vmeta p{display:none}
}
.filters button,.drive-links a,.vplay,.lb-box,.lb-nav button,.lb-close{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(185%);backdrop-filter:blur(18px) saturate(185%);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow)}
.lb-box{background:linear-gradient(140deg,rgba(255,255,255,.86),rgba(255,255,255,.66))}
.vid-status{font-size:13px;color:var(--muted);margin:-6px 0 12px}

/* section scaffolding */
.sec{padding:clamp(72px,9vw,130px) 0}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:20px 40px;margin-bottom:clamp(36px,4vw,56px)}
.h2{font-weight:880;font-stretch:66%;font-size:clamp(46px,6.6vw,96px);line-height:.9;letter-spacing:-.015em;margin:0}
.lead{max-width:42ch;color:var(--ink-2);margin:0;font-size:18px}
.rv{opacity:0;transform:translateY(28px);transition:opacity 1s var(--ease),transform 1.1s var(--ease)}
.rv.in,.booted .rv{opacity:1;transform:none}

/* work */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,2vw,24px)}
.wcard{display:flex;flex-direction:column;text-decoration:none;border-radius:26px;overflow:hidden;background:var(--soft);border:1px solid var(--line);transition:transform .7s var(--ease),box-shadow .7s var(--ease)}
.wcard.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
a.wcard:hover{transform:translateY(-4px);box-shadow:0 24px 60px -28px rgba(0,0,0,.35)}
.cover{position:relative;aspect-ratio:16/10;overflow:hidden;background:#EDEDEA;container-type:inline-size}
.dark .cover{background:#1C1C1C}
.cover img{width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--ease)}
a.wcard:hover .cover img{transform:scale(1.05)}
.typo{position:absolute;inset:0;padding:22px 24px;display:flex;flex-direction:column;justify-content:flex-end}
.typo b{font-weight:900;font-stretch:62%;font-size:clamp(44px,15cqi,124px);line-height:.84;overflow-wrap:anywhere;letter-spacing:-.02em;transition:transform 1.2s var(--ease);transform-origin:left bottom}
a.wcard:hover .typo b{transform:scale(1.03)}
.typo .tag{position:absolute;top:20px;left:22px}
.tagchip{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:750;padding:5px 10px;border-radius:8px}
.play{position:absolute!important;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:var(--ink);transform:scale(.85);transition:transform .6s var(--ease),background .4s var(--ease)}
.play svg{width:16px;height:16px;margin-left:3px}
a.wcard:hover .play{transform:scale(1);background:var(--accent)}
.wbody{padding:22px 24px 26px;display:flex;flex-direction:column;gap:8px;flex:1}
.wbody h3{margin:0;font-size:24px;font-weight:750;font-stretch:88%;letter-spacing:-.005em}
.wbody p{margin:0;color:var(--ink-2);max-width:48ch}
.dark .wbody p{color:#BDBDBD}
.wlink{margin-top:auto;padding-top:14px;font-weight:650;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.wlink u{text-decoration:none;background-image:linear-gradient(currentColor,currentColor);background-size:0 1.5px;background-repeat:no-repeat;background-position:0 100%;transition:background-size .6s var(--ease)}
a.wcard:hover .wlink u{background-size:100% 1.5px}
.wlink.off{color:var(--muted)}
.extras{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.extras a{font-size:14px;font-weight:600;text-decoration:none;padding:6px 12px;border-radius:99px;border:1px solid currentColor;opacity:.85;transition:opacity .3s,background .4s var(--ease)}
.extras a:hover{opacity:1;background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.owner-hint{display:none;font-size:13px;color:var(--muted);margin-top:4px}
.is-admin .owner-hint{display:block}

/* stats */
.stats{background:var(--ink);color:#fff;border-radius:32px;padding:clamp(40px,5vw,64px) clamp(24px,4vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:32px}
.stat b{display:block;font-weight:900;font-stretch:62%;font-size:clamp(64px,8vw,112px);line-height:.9;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat b em{font-style:normal;color:var(--accent)}
.stat span{display:block;margin-top:10px;color:#BDBDBD;font-size:16px}

/* about */
.about .wrap{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(32px,6vw,88px);align-items:center}
.about .wrap.solo{grid-template-columns:minmax(0,1fr)}
.about-copy .h2{margin-bottom:28px}
.about-text{font-size:clamp(19px,1.85vw,25px);line-height:1.5;font-weight:450;letter-spacing:-.003em;margin:0;max-width:40ch}
.about-text .mark{font-weight:650}
.tools{margin-top:36px}
.tools h3{font-size:15px;font-weight:600;color:var(--muted);margin:0 0 12px}
.tools ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.tools li{padding:9px 16px;border-radius:99px;font-weight:600;font-size:15px}
.about-photo{position:relative;margin:0;aspect-ratio:4/5;border-radius:30px;padding:10px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(185%);backdrop-filter:blur(18px) saturate(185%);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow),0 30px 60px -30px rgba(17,17,17,.35)}
.about-photo .ph-in{width:100%;height:100%;border-radius:22px;overflow:hidden}
.about-photo img{width:100%;height:100%;object-fit:cover;transition:transform 1.6s var(--ease)}
.about-photo:hover img{transform:scale(1.04)}

.bg-blobs i:nth-child(3){width:38vmax;height:38vmax;right:8vw;bottom:-16vmax;background:radial-gradient(circle,#EF8665 0,rgba(239,134,101,0) 64%);opacity:.75;animation-duration:30s;animation-delay:-14s}

 background:linear-gradient(135deg,rgba(255,255,255,1),rgba(255,255,255,.15) 32%,rgba(255,255,255,0) 52%,rgba(255,255,255,.25) 72%,rgba(255,255,255,.95));

  root.querySelectorAll(".rv,.frame,.chips,.mark").forEach(function(el){el.classList.add(el.classList.contains("mark")?"on":"in")});

  if(!e.isIntersecting)return;var el=e.target;io.unobserve(el);
  if(el.classList.contains("mark")){setTimeout(function(){el.classList.add("on")},el.id==="heroMark"?700:250)}
